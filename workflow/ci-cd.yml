name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  backend:
    name: Backend CI (Django)
    runs-on: ubuntu-latest

    steps:
      name: Checkout code
      uses: actions/checkout@v3

      name: Build backend Docker image
      run: docker build -t backend ./u
      working-directory: backend

      name: Install backend dependencies & run tests
      run: |
        pip install -r requirements.txt
        python manage.py test
      working-directory: backend


  frontend: 
    name: Frontend CI (React)
    runs-on: ubuntu-latest

    steps:
      name: Checkout code
      uses: actions/checkout@v3

      name: Build frontend docker image
      run: docker build -t frontend-image ./
      working-directory: frontend

      name: Install frontend dependencies & run tests & build
      run: |
        npm ci 
        npm test --if-present 
        npm run build
      working-directory: frontend



  deploy:
    name: CD - Deploy Step (example placeholder)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      name: Deployment placeholder
      run: echo "Both Docker images built & tests passed ✅ - ready to deploy!"      
