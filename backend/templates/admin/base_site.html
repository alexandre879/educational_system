{% extends "admin/base_site.html" %}
{% load i18n %}

{% block usertools %}
  <div id="user-tools">
    {% if has_permission %}
      {% get_current_language as CURRENT_LANGUAGE %}
      <form action="{% url 'set_language' %}" method="post" style="display:inline; margin-right: 12px;">
        {% csrf_token %}
        <input name="next" type="hidden" value="" />
        <select
          name="language"
          onchange="
            const lang = this.value;
            const path = window.location.pathname;
            let nextPath = path;

            if (/^\/back\/(en|ka|ru)(\/|$)/.test(path)) {
              nextPath = path.replace(/^\/back\/(en|ka|ru)(?=\/|$)/, '/back/' + lang);
            } 
            else if (/^\/(en|ka|ru)(\/|$)/.test(path)) {
              nextPath = path.replace(/^\/(en|ka|ru)(?=\/|$)/, '/' + lang);
            } 
            else {
              nextPath = '/back/' + lang + (path.startsWith('/') ? path : '/' + path);
            }

            this.form.querySelector('input[name=next]').value =
              nextPath + window.location.search + window.location.hash;

            this.form.submit();
          "
        >
          {% get_available_languages as LANGUAGES %}
          {% for lang_code, lang_name in LANGUAGES %}
            <option value="{{ lang_code }}" {% if lang_code == CURRENT_LANGUAGE %}selected{% endif %}>
              {{ lang_name }}
            </option>
          {% endfor %}
        </select>
      </form>
    {% endif %}
    {{ block.super }}
  </div>
{% endblock %}
