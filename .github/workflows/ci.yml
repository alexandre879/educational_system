# Runs every test, type check, lint and build on pushes to main and on pull requests,
# then deploys main to https://blueapp.store once everything has passed (CD).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels an older run, except on main: never cut a deploy off half way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: System checks
        run: python manage.py check --settings=configuration.settings_test
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=configuration.settings_test
      - name: Tests
        run: python manage.py test api --settings=configuration.settings_test

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Tests
        run: npx jest --ci
      - name: Expo config is valid
        run: npx expo-doctor
        env:
          # Expo ships SDK patch releases often; being one patch behind shouldn't fail CI.
          # Update them now and then with `npx expo install --fix` in mobile/.
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
      - name: iOS and Android bundles build
        run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/mobile-export"
        env:
          CI: "1"

  frontend:
    name: Website (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: https://example.com/api

  deploy:
    name: Deploy to blueapp.store
    # Only after every check has passed, and only for main (a merge), never for pull requests.
    needs: [backend, mobile, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          # A key that can only run k8s/production/server-deploy.sh on the server.
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # The server's own key, so the connection can't be sent anywhere else.
          KNOWN_HOST: "209.38.108.180 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPk/uoCvxpvtp/9KziearLkFI7HSpwV7QFGkyqY9JTtu"
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Automatic deploys are off: add the DEPLOY_SSH_KEY secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          # The server checks out this commit from GitHub, builds it and rolls it out.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 \
            root@209.38.108.180 "$GITHUB_SHA"
