# Runs every test, type check, lint and build on pushes to main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: System checks
        run: python manage.py check --settings=configuration.settings_test
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=configuration.settings_test
      - name: Tests
        run: python manage.py test api --settings=configuration.settings_test

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Tests
        run: npx jest --ci
      - name: Expo config is valid
        run: npx expo-doctor
        env:
          # Expo ships SDK patch releases often; being one patch behind shouldn't fail CI.
          # Update them now and then with `npx expo install --fix` in mobile/.
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
      - name: iOS and Android bundles build
        run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/mobile-export"
        env:
          CI: "1"

  frontend:
    name: Website (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: https://example.com/api
