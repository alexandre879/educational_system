# Non-secret backend settings. These win over the same keys in the backend-env secret (built from backend/.env).
# For a public deployment, change the localhost values to your domain and set DJANGO_FORCE_HTTPS to "1".
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DJANGO_SETTINGS_MODULE: configuration.settings_docker
  DJANGO_DEBUG: "0"
  DJANGO_FORCE_HTTPS: "0"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080
  CORS_ALLOWED_ORIGINS: http://localhost:8080
  DB_HOST: postgres
  DB_PORT: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  # The entrypoint runs migrations, so never let two versions start at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: backend
          image: education-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: backend-env
            - configMapRef:
                name: backend-config
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          # TCP probes: an HTTP probe would be rejected by ALLOWED_HOSTS (it uses the pod IP as Host).
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
