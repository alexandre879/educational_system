# The Telegram OTP bot (long polling). Off by default: Telegram allows only one poller per BOT_TOKEN,
# so starting it here would fight any other running copy (e.g. production) for updates.
# Turn it on with: kubectl -n education scale deploy/telegram-bot --replicas=1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telegram-bot
  template:
    metadata:
      labels:
        app: telegram-bot
    spec:
      containers:
        - name: telegram-bot
          image: education-backend:local
          imagePullPolicy: IfNotPresent
          # Bypasses the entrypoint so migrations only ever run in the backend pod.
          command: ["python", "run_bot.py"]
          envFrom:
            - secretRef:
                name: backend-env
            - configMapRef:
                name: backend-config
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
