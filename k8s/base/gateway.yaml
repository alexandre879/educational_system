# One entry point, routed like the DigitalOcean app: /back/* goes to Django with the /back prefix
# stripped (settings_docker sets FORCE_SCRIPT_NAME = "/back"), everything else goes to Next.js.
# On a cloud cluster, change the Service type to LoadBalancer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
data:
  default.conf: |
    # Keep the scheme set by an outer load balancer (https), else use our own.
    map $http_x_forwarded_proto $forwarded_proto {
      default $http_x_forwarded_proto;
      ""      $scheme;
    }

    server {
      listen 8080;
      client_max_body_size 50m;

      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

      location = /back {
        return 301 /back/;
      }

      location /back/ {
        proxy_pass http://backend:8000/;
      }

      location / {
        proxy_pass http://frontend:3000;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: config
          configMap:
            name: gateway-nginx
