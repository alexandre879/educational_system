# Local cluster for k8s/deploy.sh. The gateway's NodePort (30080) is published on http://localhost:8080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: education
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
